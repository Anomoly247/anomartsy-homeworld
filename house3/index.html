<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#dff4ff">
  <meta name="description" content="Mood Buddies House 3 — a cozy place to practice bright and calm feelings.">
  <title>House 3 · Mood Buddies</title>
  <style>
    :root { color-scheme: light; --ink:#25415d; --sky:#e9f8ff; --pink:#ffb6d8; --sun:#ffd85c; --cloud:#bde5ff; --card:rgba(255,255,255,.82); }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; font-family:ui-rounded,"Avenir Next",system-ui,sans-serif; color:var(--ink); background:radial-gradient(circle at 20% 10%,#fff 0 12%,transparent 36%),linear-gradient(155deg,#fff5fb 0%,var(--sky) 55%,#e9e2ff 100%); }
    main { width:min(920px,100%); min-height:100vh; margin:auto; padding:clamp(20px,5vw,56px) 20px 36px; display:flex; flex-direction:column; align-items:center; gap:22px; }
    header { text-align:center; max-width:640px; } .eyebrow { margin:0 0 8px; color:#a15589; font-size:.78rem; font-weight:800; letter-spacing:.16em; text-transform:uppercase; } h1 { margin:0; font-size:clamp(2.3rem,7vw,4.8rem); line-height:.95; letter-spacing:-.06em; color:#365678; } .intro { margin:14px 0 0; font-size:clamp(1rem,2.5vw,1.2rem); line-height:1.5; }
    .playground { width:100%; padding:clamp(18px,4vw,34px); border:2px solid rgba(255,255,255,.9); border-radius:32px; background:var(--card); box-shadow:0 20px 60px rgba(98,122,168,.18); backdrop-filter:blur(12px); } .buddies { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:clamp(12px,3vw,28px); }
    .buddy { appearance:none; width:100%; min-height:260px; padding:24px 14px 18px; border:3px solid transparent; border-radius:26px; color:var(--ink); background:rgba(255,255,255,.7); cursor:pointer; transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease; } .buddy:hover,.buddy:focus-visible { transform:translateY(-4px); box-shadow:0 12px 28px rgba(77,108,148,.18); outline:none; } .buddy:focus-visible { border-color:#6c9de0; } .buddy.sunny:focus-visible { border-color:#e6ae26; } .buddy.breezy:focus-visible { border-color:#4797cb; } .buddy.is-bouncing .character { animation:bounce .55s cubic-bezier(.2,.85,.35,1); }
    .character { position:relative; width:160px; height:160px; margin:0 auto 12px; } .sun { position:absolute; inset:25px; border-radius:50%; background:var(--sun); border:5px solid #f1b93d; box-shadow:0 0 0 12px rgba(255,216,92,.24),0 8px 22px rgba(239,175,35,.28); } .sun:before { content:""; position:absolute; inset:-25px; background:repeating-conic-gradient(from 0deg,#f6c94e 0 7deg,transparent 7deg 30deg); -webkit-mask:radial-gradient(circle,transparent 0 56%,#000 58% 66%,transparent 68%); mask:radial-gradient(circle,transparent 0 56%,#000 58% 66%,transparent 68%); } .face { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; gap:25px; padding-top:8px; font-size:24px; } .face:after { content:"⌣"; position:absolute; top:91px; left:69px; font-size:30px; font-weight:800; }
    .cloud { position:absolute; left:10px; right:10px; bottom:32px; height:66px; border-radius:45px; background:var(--cloud); border:5px solid #8dc7ec; box-shadow:0 8px 20px rgba(83,153,201,.25); } .cloud:before,.cloud:after { content:""; position:absolute; bottom:28px; border-radius:50%; background:var(--cloud); border:5px solid #8dc7ec; border-bottom:0; } .cloud:before { left:27px; width:68px; height:68px; } .cloud:after { right:25px; width:54px; height:54px; } .cloud-face { position:absolute; z-index:1; left:0; right:0; top:19px; display:flex; justify-content:center; gap:27px; font-size:20px; } .cloud-face:after { content:"⌣"; position:absolute; top:17px; font-size:25px; }
    h2 { margin:0; font-size:1.55rem; } .hint { margin:5px 0 0; font-size:.95rem; color:#52708a; } .status { min-height:34px; margin:20px 0 0; display:flex; align-items:center; justify-content:center; gap:8px; text-align:center; font-weight:800; color:#74527e; } .heart { color:#ef8db7; } .reset { display:block; margin:8px auto 0; border:0; background:none; color:#527da3; text-decoration:underline; cursor:pointer; font:inherit; } footer { text-align:center; font-size:.84rem; color:#617c92; } footer a { color:inherit; }
    @keyframes bounce { 0%,100% { transform:translateY(0) rotate(0); } 35% { transform:translateY(-24px) rotate(-5deg) scale(1.04); } 70% { transform:translateY(2px) rotate(4deg); } } @media (max-width:560px) { .buddies { grid-template-columns:1fr; } .buddy { min-height:230px; } .character { transform:scale(.86); margin-top:-10px; margin-bottom:0; } } @media (prefers-reduced-motion:reduce) { *,*:before,*:after { animation-duration:.01ms !important; transition-duration:.01ms !important; } }
  </style>
</head>
<body>
  <main>
    <header><p class="eyebrow">AO Universe · House 3</p><h1>Mood Buddies</h1><p class="intro">Every feeling belongs here. Tap a buddy to share a little sunshine or a calm, cozy breath.</p></header>
    <section class="playground" aria-labelledby="choose-title"><h2 id="choose-title" style="text-align:center;margin-bottom:18px">Who would you like to visit?</h2><div class="buddies">
      <button class="buddy sunny" type="button" data-name="Sunny" aria-label="Tap Sunny, the happy bright sun"><div class="character" aria-hidden="true"><div class="sun"><div class="face"><span>•</span><span>•</span></div></div></div><h2>Sunny</h2><p class="hint">Happy &amp; bright</p></button>
      <button class="buddy breezy" type="button" data-name="Breezy" aria-label="Tap Breezy, the calm cozy cloud"><div class="character" aria-hidden="true"><div class="cloud"><div class="cloud-face"><span>•</span><span>•</span></div></div></div><h2>Breezy</h2><p class="hint">Calm &amp; cozy</p></button>
    </div><p class="status" role="status" aria-live="polite"><span class="heart" aria-hidden="true">♥</span><span id="message">Choose a buddy to begin.</span></p><button class="reset" type="button" id="reset">Start over</button></section>
    <footer><a href="../">Return to the Master Hub</a> · Made with care for little listeners</footer>
  </main>
  <script>
    (function () { var buttons=document.querySelectorAll('.buddy'),message=document.getElementById('message'),lines={Sunny:['You found a bright moment!','Sunny says: your smile can glow.','It is okay to feel happy.'],Breezy:['Take one slow, cozy breath.','Breezy says: calm can arrive softly.','It is okay to need a quiet cloud.']}; buttons.forEach(function(button){button.addEventListener('click',function(){var name=button.dataset.name;button.classList.remove('is-bouncing');void button.offsetWidth;button.classList.add('is-bouncing');message.textContent=lines[name][Math.floor(Math.random()*lines[name].length)];});button.addEventListener('animationend',function(){button.classList.remove('is-bouncing');});}); document.getElementById('reset').addEventListener('click',function(){message.textContent='Choose a buddy to begin.';}); }());
  </script>
</body>
</html>
